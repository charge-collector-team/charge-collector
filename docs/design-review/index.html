<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기존 구성 · 스타일 전후 검토</title><style>body{margin:0;background:#f7f8fa;color:#1d1e21;font-family:system-ui,sans-serif}header{padding:32px 40px 20px;border-bottom:1px solid #e0e1e6}h1{font-size:28px;margin:0 0 12px}p{line-height:1.6;color:#686a72;margin:8px 0}nav{padding:16px 40px;display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:0;background:#f7f8fa;z-index:2;border-bottom:1px solid #e0e1e6}button{font:inherit;cursor:pointer;border:1px solid #e0e1e6;padding:10px 14px;border-radius:8px;background:white;color:#44464e}button[aria-pressed=true]{background:#44464e;color:white}main{padding:24px 40px}h2{font-size:22px;margin:0 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.grid img{width:100%;display:block;border:1px solid #e0e1e6;border-radius:10px}figure{margin:12px 0}figcaption{font-size:14px;margin-bottom:10px;color:#686a72}a{color:#44464e}footer{padding:20px 40px;border-top:1px solid #e0e1e6;color:#686a72;font-size:14px}@media(max-width:900px){.grid{grid-template-columns:1fr}header,main,nav,footer{padding-left:20px;padding-right:20px}}</style><header><h1>기존 구성 · 스타일 전후 검토</h1><p>민형이 버전의 화면 구성과 동작을 유지한 디자인 브랜치. 2026-11-15 · 샘플 2026-12-03</p><p>기존 엔진 테스트 32개 통과 · APK 빌드 통과 · 검토 후 머지</p><a href="README.md">변경 범위·실행 방법·미확인 항목</a> · <a href="label-proposal.md">교환 곡선 클립 선택안 (앱 미적용)</a></header><nav aria-label="화면 선택"></nav><main><h2></h2><p id="note"></p><div class="grid"><figure><figcaption>변경 전 · 원본 main APK</figcaption><a id="before-link"><img id="before" alt=""></a></figure><figure><figcaption>변경 후 · 스타일 브랜치 APK</figcaption><a id="after-link"><img id="after" alt=""></a></figure></div></main><footer>차량 OS 영역만 잘라낸 실제 실행 화면입니다. 주행 제한 전후 캡처는 미확보이며 차량 시험 환경에서 추가 확인합니다.</footer><script>const screens=[{"id": "collection", "title": "메달함 기본", "note": "현위치·메달 진열장의 기존 두 영역 배치 유지.", "before": "before-collection.png", "after": "after-collection.png"}, {"id": "regions", "title": "지역별 진열", "note": "시·군·구 목록과 도안별 동·은·금 배열 유지.", "before": "before-regions.png", "after": "after-regions.png"}, {"id": "detail", "title": "메달 상세", "note": "공주 공산성 미소장 금 배지. 왼쪽 상세와 오른쪽 선택 상태 비교.", "before": "before-detail.png", "after": "after-detail.png"}, {"id": "friends", "title": "친구 목록", "note": "기존 샘플 친구 3명. 아래로 스크롤하면 교환 버튼이 보임.", "before": "before-friends.png", "after": "after-friends.png"}, {"id": "friends-lower", "title": "친구 목록 · 아래쪽", "note": "같은 목록을 스크롤한 상태. 친구와 교환 버튼 유지.", "before": "before-friends-lower.png", "after": "after-friends-lower.png"}, {"id": "trade", "title": "새 교환 제안", "note": "배지를 고르기 전의 빈 슬롯과 비활성 버튼.", "before": "before-trade.png", "after": "after-trade.png"}, {"id": "trade-selected", "title": "교환 · 배지 선택", "note": "고양 동 ↔ 이천 쌀 동. 보내기/받기 선택과 수량 설명 유지. 실제 제안 전송은 하지 않음.", "before": "before-trade-selected.png", "after": "after-trade-selected.png"}, {"id": "anniversary", "title": "1주년 지도", "note": "직접 충전한 장소와 첫 방문 순서. 기존 지도 확대·이동 동작 유지.", "before": "before-anniversary.png", "after": "after-anniversary.png"}, {"id": "anniversary-detail", "title": "1주년 · 충전소 선택", "note": "고양시 지점 선택 후 지도 확대와 배지 상세 표시.", "before": "before-anniversary-detail.png", "after": "after-anniversary-detail.png"}, {"id": "tree", "title": "연말 트리", "note": "트리 장면과 오너먼트 6개는 기존 그림과 배치 유지.", "before": "before-tree.png", "after": "after-tree.png"}, {"id": "tree-editor", "title": "트리 · 장식 상세", "note": "첫 오너먼트를 누른 상태. 이야기/바꾸기 탭과 옆 패널 유지.", "before": "before-tree-editor.png", "after": "after-tree-editor.png"}, {"id": "acquired", "title": "배지 획득", "note": "기존 늑구 한정 획득 화면. 원본 메달 그림 유지.", "before": "before-acquired.png", "after": "after-acquired.png"}, {"id": "charging", "title": "충전 상태", "note": "샘플 마지막 충전 기록. 진행률·받은 배지·도감 복귀 버튼 유지.", "before": "before-charging.png", "after": "after-charging.png"}];const nav=document.querySelector('nav');function select(i){const s=screens[i];document.querySelector('h2').textContent=s.title;document.querySelector('#note').textContent=s.note;for(const k of ['before','after']){document.getElementById(k).src=s[k];document.getElementById(k).alt=s.title+(k==='before'?' 변경 전':' 변경 후');document.getElementById(k+'-link').href=s[k]}nav.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)))}screens.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.title;b.onclick=()=>select(i);nav.append(b)});select(0);</script></html>
